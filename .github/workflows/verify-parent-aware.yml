name: Verify current parent-aware 17-square lower bound

on:
  workflow_dispatch:
  push:
    paths:
      - 'certificates/lower_bound_4p614153/**'
      - 'certificates/intersection_trigger_29/**'
      - 'verify_all.sh'
      - 'paper/**'
      - '.github/workflows/verify-parent-aware.yml'
  pull_request:
    paths:
      - 'certificates/lower_bound_4p614153/**'
      - 'certificates/intersection_trigger_29/**'
      - 'verify_all.sh'
      - 'paper/**'
      - '.github/workflows/verify-parent-aware.yml'

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install exact replay dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev python3
      - name: Refuse a headline regression
        run: |
          python3 - <<'PYCODE'
          import json
          from fractions import Fraction
          from pathlib import Path
          result = json.loads(Path('certificates/lower_bound_4p614153/result.json').read_text())
          if Fraction(result['target']) < Fraction(18452, 3999):
              raise SystemExit('Lower-bound frontier regression refused')
          if Fraction(result['analytic_sharpening']['target']) < Fraction(46129999999859, 9997499999900):
              raise SystemExit('Analytic lower-bound regression refused')
          if result.get('optimality_proved'):
              raise SystemExit('This certificate must not claim global optimality')
          PYCODE
      - name: Replay current exact certificate and pinned R012 source
        run: |
          python3 certificates/lower_bound_4p614153/verify.py \
            --output /tmp/n17-parent-aware --upstream --direct
          python3 certificates/lower_bound_4p614153/test_verify.py
          python3 certificates/lower_bound_4p614153/check_diagnostics.py

      - name: Verify finite intersection-trigger separation
        run: python3 certificates/intersection_trigger_29/test_verify.py
